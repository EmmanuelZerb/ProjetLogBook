<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Logbook</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-content">
            <div class="auth-left">
                <div class="auth-left-content">
                    <div class="logo">
                        <h1>Logbook</h1>
                    </div>
                    <p class="tagline">Des corrections à l'oral pour motiver les élèves et soulager les enseignants</p>
                    <div class="space-type">
                        <span>📚</span>
                        <span>Espace réservé aux enseignants</span>
                    </div>
                </div>
            </div>
            <div class="auth-right">
                <div class="auth-form-container">
                    <h2>Connexion</h2>
                    
                    <form id="auth-form" onsubmit="handleLogin(event)">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" required>
                        </div>
                        <div class="form-group">
                            <label for="password">Mot de passe</label>
                            <input type="password" id="password" required>
                        </div>
                        <button type="submit" class="btn-primary">Se connecter</button>
                        
                        <p id="error-message" class="error-message"></p>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const supabaseClient = supabase.createClient(
            'https://qhvdxwmjjfxocczbuhio.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFodmR4d21qamZ4b2NjemJ1aGlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzk5NjQyNzgsImV4cCI6MjA1NTU0MDI3OH0.usp6Jgo4DK-M5strzUGY2pk7qdvnjQw9AQrhVFk-i-U'
        );

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('error-message');
            
            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) throw error;

                if (data.user) {
                    window.location.href = 'index.html';
                }
            } catch (error) {
                console.error('Erreur:', error);
                errorMessage.textContent = 'Email ou mot de passe incorrect';
            }
        }

        // Vérifier si l'utilisateur est déjà connecté
        window.onload = async function() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (user) {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
