<!DOCTYPE html>
<html lang="fr">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Logbook - Transcription Audio</title>
   <link rel="stylesheet" href="styles.css">
   <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
   <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
   <header class="header">
       <div class="container header-content">
           <div class="logo">
               <svg width="150" height="40" viewBox="0 0 150 40" xmlns="http://www.w3.org/2000/svg">
                   <text x="0" y="30" font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="#1F4D4D">Logbook</text>
               </svg>
           </div>
           <div class="user-info">
               <span class="user-name" id="userEmail"></span>
               <button onclick="logout()" class="logout-btn">Déconnexion</button>
           </div>
       </div>
   </header>

   <main class="container dashboard">
       <div class="stats-grid">
           <div class="stat-card">
               <h3>Enregistrements</h3>
               <div class="value" id="totalRecordings">0</div>
           </div>
           <div class="stat-card">
               <h3>Durée totale</h3>
               <div class="value" id="totalDuration">0min</div>
           </div>
           <div class="stat-card">
               <h3>Dernier enregistrement</h3>
               <div class="value" id="lastRecording">-</div>
           </div>
       </div>

       <nav class="tabs">
           <button class="tab-btn active" onclick="switchTab('record')">
               <span class="tab-icon">🎤</span>
               Enregistrement
           </button>
           <button class="tab-btn" onclick="switchTab('history')">
               <span class="tab-icon">📋</span>
               Historique
           </button>
       </nav>

       <div id="record-tab" class="tab-content">
           <div class="record-section">
               <h2>Nouvel enregistrement</h2>
               <div class="controls">
                   <button id="startBtn" class="record-btn">Démarrer l'enregistrement</button>
                   <button id="stopBtn" class="record-btn" disabled>Arrêter l'enregistrement</button>
               </div>
               <div class="recording-status" id="recordingStatus" style="display: none;">
                   <div class="recording-indicator"></div>
                   <span>Enregistrement en cours...</span>
               </div>
               <div class="transcription-live">
                   <h3>Transcription en direct</h3>
                   <div id="transcription"></div>
               </div>
               <div id="statusMessage" class="status-message"></div>
           </div>
       </div>

       <div id="history-tab" class="tab-content" style="display: none;">
           <h2>Historique des enregistrements</h2>
           <div id="recordingsList" class="recordings-grid"></div>
       </div>
   </main>

   <script>
       const supabaseClient = supabase.createClient(
           'https://qhvdxwmjjfxocczbuhio.supabase.co',
           'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFodmR4d21qamZ4b2NjemJ1aGlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzk5NjQyNzgsImV4cCI6MjA1NTU0MDI3OH0.usp6Jgo4DK-M5strzUGY2pk7qdvnjQw9AQrhVFk-i-U'
       );

       window.onload = async function() {
           const { data: { user } } = await supabaseClient.auth.getUser();
           if (!user) {
               window.location.href = 'auth.html';
               return;
           }
           document.getElementById('userEmail').textContent = user.email;
           await loadRecordings();
           await updateStats();
       }

       async function updateStats() {
           const { data: { user } } = await supabaseClient.auth.getUser();
           const { data: audioFiles, error } = await supabaseClient.storage
               .from('recordings')
               .list(`audio/${user.id}`);

           if (!error && audioFiles) {
               document.getElementById('totalRecordings').textContent = audioFiles.length;
               
               if (audioFiles.length > 0) {
                   const lastFile = audioFiles[audioFiles.length - 1];
                   const date = new Date(lastFile.created_at);
                   document.getElementById('lastRecording').textContent = date.toLocaleDateString();
               }
               
               document.getElementById('totalDuration').textContent = `${audioFiles.length * 2}min`;
           }
       }

       async function logout() {
           await supabaseClient.auth.signOut();
           window.location.href = 'auth.html';
       }

       async function loadRecordings() {
           const { data: { user } } = await supabaseClient.auth.getUser();
           const recordingsList = document.getElementById('recordingsList');
           recordingsList.innerHTML = '';

           try {
               const { data: audioFiles, error } = await supabaseClient.storage
                   .from('recordings')
                   .list(`audio/${user.id}`, {
                       limit: 100,
                       offset: 0,
                       sortBy: { column: 'created_at', order: 'desc' }
                   });

               if (error) throw error;

               if (!audioFiles || audioFiles.length === 0) {
                   recordingsList.innerHTML = '<p>Aucun enregistrement trouvé.</p>';
                   return;
               }

               for (const file of audioFiles) {
                   const recordingCard = document.createElement('div');
                   recordingCard.classList.add('recording-card');
                   
                   const { data: audioData, error: audioError } = await supabaseClient.storage
                       .from('recordings')
                       .download(`audio/${user.id}/${file.name}`);

                   if (audioError) {
                       console.error("Erreur téléchargement audio:", audioError);
                       continue;
                   }

                   const textFileName = file.name.replace('.wav', '.txt');
                   const { data: textFiles, error: textListError } = await supabaseClient.storage
                       .from('recordings')
                       .list(`text/${user.id}`);

                   let transcriptionText = "Transcription non disponible";
                   let textContent = null;

                   if (textFiles && textFiles.some(f => f.name === textFileName)) {
                       const { data: textData, error: textError } = await supabaseClient.storage
                           .from('recordings')
                           .download(`text/${user.id}/${textFileName}`);

                       if (textData && !textError) {
                           textContent = textData;
                           transcriptionText = await textData.text();
                       }
                   }

                   const audioUrl = URL.createObjectURL(audioData);
                   const date = new Date(file.created_at).toLocaleString();

                   recordingCard.innerHTML = `
                       <div class="recording-header">
                           <div class="recording-info">
                               <strong>Enregistrement</strong>
                               <span>${date}</span>
                           </div>
                           <div class="recording-actions">
                               <button class="btn-primary download-btn">Télécharger</button>
                               <button class="btn view-btn">Détails</button>
                           </div>
                       </div>
                       <div class="recording-content" style="display:none;">
                           <audio controls controlsList="nodownload">
                               <source src="${audioUrl}" type="audio/wav">
                               Votre navigateur ne supporte pas l'audio.
                           </audio>
                           <div class="transcription">
                               <h4>Transcription</h4>
                               <p>${transcriptionText}</p>
                           </div>
                       </div>
                   `;

                   const downloadBtn = recordingCard.querySelector('.download-btn');
                   downloadBtn.addEventListener('click', async () => {
                       const audioBlob = new Blob([audioData], { type: 'audio/wav' });
                       const audioDownloadUrl = URL.createObjectURL(audioBlob);
                       const audioLink = document.createElement('a');
                       audioLink.href = audioDownloadUrl;
                       audioLink.download = file.name;
                       audioLink.click();
                       URL.revokeObjectURL(audioDownloadUrl);

                       if (textContent) {
                           const textBlob = new Blob([await textContent.text()], { type: 'text/plain' });
                           const textDownloadUrl = URL.createObjectURL(textBlob);
                           const textLink = document.createElement('a');
                           textLink.href = textDownloadUrl;
                           textLink.download = textFileName;
                           textLink.click();
                           URL.revokeObjectURL(textDownloadUrl);
                       }
                   });

                   const viewBtn = recordingCard.querySelector('.view-btn');
                   const contentDiv = recordingCard.querySelector('.recording-content');
                   viewBtn.addEventListener('click', () => {
                       const isHidden = contentDiv.style.display === 'none';
                       contentDiv.style.display = isHidden ? 'block' : 'none';
                       viewBtn.textContent = isHidden ? 'Masquer' : 'Détails';
                   });

                   recordingsList.appendChild(recordingCard);
               }
           } catch (error) {
               console.error('Erreur lors du chargement des enregistrements:', error);
               recordingsList.innerHTML = `<p>Erreur: ${error.message}</p>`;
           }
       }

       function showStatus(message, isSuccess = true) {
           const statusMessage = document.getElementById('statusMessage');
           statusMessage.style.display = 'block';
           statusMessage.className = `status-message ${isSuccess ? 'status-success' : 'status-error'}`;
           statusMessage.textContent = message;
       }

       function switchTab(tabName) {
           document.querySelectorAll('.tab-content').forEach(tab => {
               tab.style.display = 'none';
           });
           document.getElementById(`${tabName}-tab`).style.display = 'block';
           
           document.querySelectorAll('.tab-btn').forEach(btn => {
               btn.classList.remove('active');
           });
           event.target.classList.add('active');

           if (tabName === 'history') {
               loadRecordings();
               updateStats();
           }
       }

       let ws;
       const startBtn = document.getElementById('startBtn');
       const stopBtn = document.getElementById('stopBtn');
       const transcriptionDiv = document.getElementById('transcription');
       const recordingStatus = document.getElementById('recordingStatus');
       let fullText = '';

       async function startRecording() {
           const { data: { user }, error } = await supabaseClient.auth.getUser();
           if (error || !user) {
               showStatus('Veuillez vous connecter', false);
               return;
           }

           const { data: { session } } = await supabaseClient.auth.getSession();
           if (!session) {
               showStatus('Impossible de récupérer la session', false);
               return;
           }

           const token = session.access_token;
           const wsUrl = `ws://localhost:8765?userId=${user.id}&token=${encodeURIComponent(token)}`;
           
           ws = new WebSocket(wsUrl);
           
           ws.onopen = () => {
               startBtn.disabled = true;
               stopBtn.disabled = false;
               transcriptionDiv.textContent = '';
               fullText = '';
               recordingStatus.style.display = 'flex';
           };
           
           ws.onmessage = (event) => {
               const data = JSON.parse(event.data);
               if (data.type === 'transcript') {
                   transcriptionDiv.textContent = data.data.utterance.text.trim();
                   if (data.data.is_final) {
                       fullText += data.data.utterance.text.trim() + ' ';
                       transcriptionDiv.textContent = fullText;
                   }
               }
           };
           
           ws.onclose = () => {
               startBtn.disabled = false;
               stopBtn.disabled = true;
               recordingStatus.style.display = 'none';
           };

           ws.onerror = (error) => {
               console.error('WebSocket error:', error);
               startBtn.disabled = false;
               stopBtn.disabled = true;
               recordingStatus.style.display = 'none';
               showStatus('Erreur de connexion', false);
           };
       }

       function stopRecording() {
           if (ws) {
               showStatus('Sauvegarde en cours...');
               ws.close();
               showStatus('Enregistrement sauvegardé avec succès !');
               setTimeout(() => {
                   updateStats();
               }, 1000);
           }
       }

       startBtn.addEventListener('click', startRecording);
       stopBtn.addEventListener('click', stopRecording);
   </script>
</body>
</html>
