<!DOCTYPE html>
<html lang="fr">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Authentification</title>
   <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
   <style>
       body {
           font-family: Arial, sans-serif;
           max-width: 400px;
           margin: 20px auto;
           padding: 20px;
       }
       .form-group {
           margin-bottom: 15px;
       }
       input {
           width: 100%;
           padding: 8px;
           margin-top: 5px;
       }
       button {
           width: 100%;
           padding: 10px;
           background-color: #4CAF50;
           color: white;
           border: none;
           border-radius: 5px;
           cursor: pointer;
       }
       .error {
           color: red;
           margin-top: 10px;
       }
   </style>
</head>
<body>
   <div id="auth-form">
       <h2>Connexion</h2>
       <div class="form-group">
           <label for="email">Email</label>
           <input type="email" id="email" required>
       </div>
       <div class="form-group">
           <label for="password">Mot de passe</label>
           <input type="password" id="password" required>
       </div>
       <button onclick="login()">Se connecter</button>
       <p id="error-message" class="error"></p>
   </div>

   <script>
       const supabaseClient = supabase.createClient(
           'https://qhvdxwmjjfxocczbuhio.supabase.co',
           'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFodmR4d21qamZ4b2NjemJ1aGlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzk5NjQyNzgsImV4cCI6MjA1NTU0MDI3OH0.usp6Jgo4DK-M5strzUGY2pk7qdvnjQw9AQrhVFk-i-U'
       );

       async function login() {
           const email = document.getElementById('email').value;
           const password = document.getElementById('password').value;
           const errorMessage = document.getElementById('error-message');

           try {
               console.log("Tentative de connexion");
               const response = await supabaseClient.auth.signInWithPassword({
                   email: email,
                   password: password
               });

               console.log("Réponse:", response);

               if (response.error) {
                   throw response.error;
               }

               if (response.data.user) {
                   console.log("Succès !");
                   localStorage.setItem('user', JSON.stringify(response.data.user));
                   window.location.href = 'index.html';
               } else {
                   errorMessage.textContent = "Une erreur est survenue";
               }
           } catch (error) {
               console.error("Erreur:", error);
               errorMessage.textContent = error.message;
           }
       }

       window.onload = async function() {
           const { data: { user } } = await supabaseClient.auth.getUser();
           if (user) {
               window.location.href = 'index.html';
           }
       }
   </script>
</body>
</html>
